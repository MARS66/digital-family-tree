services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: digital_family_tree
      POSTGRES_PASSWORD: digital_family_tree
      POSTGRES_USER: digital_family_tree
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U digital_family_tree -d digital_family_tree",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
